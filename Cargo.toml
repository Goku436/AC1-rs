[workspace]
resolver = "2"
members = ["crates/*"]

# Bevy is slow unoptimized; keep our code debuggable but optimize dependencies.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Line tables in the game itself, so a crash file (`ac1-crash-*.txt`) names the file and line; no speed cost.
[profile.release.package.ac1]
debug = "line-tables-only"
